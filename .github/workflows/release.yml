# v1.2.3 같은 태그를 푸시하면 빌드하고, 저장소 Secret RELEASE_KEY(= release.key 내용)로
# latest.json에 서명해 GitHub 릴리스를 만든다. 설치된 PC는 몇 시간 안에 이 릴리스로 업데이트한다.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "태그는 v1.2.3 형식이어야 해요"; exit 1; }
      - name: Build and sign
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then echo "저장소 Secret RELEASE_KEY 가 없어요 (README 「자동 업데이트」)"; exit 1; fi
          umask 077
          printf '%s\n' "$RELEASE_KEY" > release.key
          VERSION="$GITHUB_REF_NAME" ./build.sh
          rm -f release.key
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/gcfldrive-setup.exe dist/gcfldrive.exe dist/latest.json dist/install.cmd dist/uninstall.cmd \
            --title "$GITHUB_REF_NAME" --generate-notes
